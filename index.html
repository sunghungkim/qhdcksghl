<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봉불사 · 성지순례 봉찬회</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; }
  body { display: flex; }

  /* ---------- 왼쪽 메뉴 ---------- */
  .side {
    width: 280px; flex: none;
    background: var(--sand);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 32px 18px 24px; gap: 28px;
    overflow-y: auto;
  }
  .brand { padding: 0 10px; }
  .brand .name { font-family: var(--serif); font-size: 1.7rem; font-weight: 700; color: var(--brand-dark); line-height: 1.2; }
  .brand .sub { margin-top: 6px; font-size: .95rem; color: var(--muted); }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav a {
    display: block; padding: 14px 16px; border-radius: 12px;
    color: var(--text); text-decoration: none; font-size: 1.1rem;
    border-left: 5px solid transparent;
  }
  .nav a:hover { background: rgba(140,74,47,.1); }
  .nav a[aria-current="page"] { background: var(--panel); border-left-color: var(--brand); color: var(--brand-dark); font-weight: 700; box-shadow: 0 1px 0 var(--line); }
  .side .call { margin-top: auto; padding: 16px; border-top: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
  .side .call a { display: block; margin-top: 4px; font-size: 1.35rem; font-weight: 700; color: var(--brand-dark); text-decoration: none; }

  /* ---------- 가운데 화면 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .main > header { padding: 22px 40px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 5; }
  .main > header h1 { margin: 0; font-size: 1.8rem; }
  .who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .who .name { font-weight: 700; color: var(--brand-dark); }
  .stage { flex: 1; min-height: 0; position: relative; }
  .view { display: none; height: 100%; }
  .view.on { display: block; }
  iframe.frame { width: 100%; height: 100%; border: 0; background: var(--bg); }

  .pad { padding: 36px 40px 56px; overflow: auto; height: 100%; }
  .hero { max-width: 820px; display: grid; gap: 22px; margin-bottom: 36px; }
  /* 사진 넘기기(슬라이드) */
  .hero-media { display: grid; gap: 8px; }
  .carousel { position: relative; overflow: hidden; border-radius: 16px; background: var(--sand); aspect-ratio: 16 / 9; touch-action: pan-y; }
  .slides { display: flex; height: 100%; transition: transform .7s ease; }
  .slides.no-anim { transition: none; }
  .slide { flex: 0 0 100%; min-width: 0; height: 100%; margin: 0; }
  .slide img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .car-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border: 0; border-radius: 50%;
    background: rgba(42,29,20,.55); color: #fff; font-size: 1.7rem; line-height: 1;
    display: grid; place-items: center; padding: 0 0 4px; cursor: pointer;
  }
  .car-btn:hover { background: rgba(42,29,20,.82); }
  .car-btn.prev { left: 10px; }
  .car-btn.next { right: 10px; }
  .car-dots { display: flex; justify-content: center; align-items: center; gap: 0; }
  .car-dot { width: 26px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .car-dot::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #cdb995; transition: width .3s ease, background .3s ease; }
  .car-dot[aria-current="true"]::before { width: 22px; border-radius: 5px; background: var(--brand); }
  @media (prefers-reduced-motion: reduce) { .slides { transition: none; } }
  .hero .tag { margin: 0; color: var(--muted); font-size: 1rem; }
  .hero h2 { margin: 0; font-size: 2.1rem; color: var(--brand-dark); }
  .hero p { margin: 0; line-height: 1.8; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; max-width: 820px; }
  .menu-card {
    display: block; padding: 24px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px;
    color: inherit; text-decoration: none;
  }
  .menu-card:hover { border-color: var(--brand); background: #fffaf0; }
  .menu-card b { display: block; font-family: var(--serif); font-size: 1.3rem; margin-bottom: 6px; color: var(--brand-dark); }
  .menu-card span { color: var(--muted); }

  .soon { height: 100%; display: grid; place-items: center; text-align: center; padding: 32px; }
  .soon .badge { display: inline-block; font-size: 1rem; padding: 6px 16px; background: #f3e1bd; color: #6f4a0c; margin-bottom: 16px; }
  .soon h2 { margin: 0 0 8px; font-size: 1.9rem; }
  .soon p { margin: 0; color: var(--muted); }

  /* ---------- 좁은 화면(휴대폰): 메뉴를 위로 ---------- */
  @media (max-width: 760px) {
    body { flex-direction: column; }
    .side { width: 100%; flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand .sub, .side .call { display: none; }
    .brand .name { font-size: 1.3rem; white-space: nowrap; }
    .nav { flex-direction: row; gap: 4px; }
    .nav a { white-space: nowrap; padding: 10px 14px; border-left: 0; border-bottom: 4px solid transparent; border-radius: 10px; font-size: 1.05rem; }
    .nav a[aria-current="page"] { border-bottom-color: var(--brand); box-shadow: none; }
    .main > header { padding: 14px 16px; }
    .main > header h1 { font-size: 1.5rem; }
    .pad, .soon { padding: 24px 16px 40px; }
    .hero h2 { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <div class="name">봉불사</div>
    <div class="sub">성지순례 봉찬회</div>
  </div>
  <nav class="nav" id="nav" aria-label="주 메뉴"></nav>
  <div class="call">문의 및 접수<a href="tel:023878578">02-387-8578</a></div>
</aside>

<div class="main">
  <header>
    <h1 id="title">홈</h1>
    <div class="who" id="who"></div>
  </header>
  <main class="stage">
    <!-- 홈 -->
    <section class="view" id="view-home">
      <div class="pad">
        <div class="hero">
          <div class="hero-media">
            <div class="carousel" id="carousel" role="group" aria-roledescription="사진 넘기기" aria-label="봉불사 사진" tabindex="0">
              <div class="slides" id="slides"></div>
              <button class="car-btn prev" id="car-prev" type="button" aria-label="이전 사진">‹</button>
              <button class="car-btn next" id="car-next" type="button" aria-label="다음 사진">›</button>
            </div>
            <div class="car-dots" id="car-dots" role="group" aria-label="사진 고르기"></div>
          </div>
          <p class="tag">발길 닿는 그곳에, 부처님의 향기 가득...</p>
          <h2>봉불사 · 성지순례 봉찬회</h2>
          <p>성지순례와 법회 일정을 한곳에서 확인하시고, 순례를 예약하실 수 있습니다.</p>
          <div class="actions">
            <a class="btn" href="#pilgrimage">성지순례 일정 보기</a>
            <a class="btn ghost" href="tel:023878578">전화 문의 02-387-8578</a>
          </div>
        </div>
        <h2 class="sec">바로가기</h2>
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <!-- 준비 중 -->
    <section class="view" id="view-soon">
      <div class="soon">
        <div>
          <span class="badge">준비 중</span>
          <h2 id="soon-name"></h2>
          <p>이 페이지는 아직 준비 중입니다. 조금만 기다려 주세요.</p>
        </div>
      </div>
    </section>

    <!-- 만들어진 페이지가 열리는 곳 -->
    <section class="view" id="view-frame">
      <iframe class="frame" id="frame" title="페이지 내용"></iframe>
    </section>
  </main>
</div>

<script>
  // 메뉴 목록. file 이 있는 페이지는 파일이 실제로 존재할 때만 가운데에 열리고,
  // 없으면 "준비 중"이 보입니다. 새 페이지 파일을 만들면 자동으로 열립니다.
  const PAGES = [
    { id: 'home',       label: '홈',            file: null,              desc: '' },
    { id: 'temple',     label: '절 소개',       file: 'temple.html',     desc: '봉불사를 소개합니다' },
    { id: 'pilgrimage', label: '성지순례 일정', file: 'pilgrimage.html', desc: '다가오는 성지순례 일정을 확인하세요' },
    { id: 'events',     label: '행사 일정',     file: 'events.html',     desc: '봉불사 행사 일정을 확인하세요' },
    { id: 'reserve',    label: '내 예약',       file: 'reserve.html',    desc: '성지순례를 예약하세요' },
    { id: 'gallery',    label: '동행의 기록',   file: 'gallery.html',    desc: '함께 다녀온 성지순례와 행사의 사진' },
    { id: 'login',      label: '로그인',        file: 'login.html',      desc: '', hidden: true }, // 왼쪽 메뉴·바로가기에는 안 보임
  ];

  const $ = (id) => document.getElementById(id);
  const views = { home: $('view-home'), soon: $('view-soon'), frame: $('view-frame') };

  PAGES.filter((p) => !p.hidden).forEach((p) => {
    const a = document.createElement('a');
    a.href = '#' + p.id;
    a.textContent = p.label;
    a.dataset.id = p.id;
    $('nav').appendChild(a);

    if (p.id !== 'home') {
      const c = document.createElement('a');
      c.className = 'menu-card';
      c.href = '#' + p.id;
      c.innerHTML = '<b></b><span></span>';
      c.querySelector('b').textContent = p.label;
      c.querySelector('span').textContent = p.desc;
      $('cards').appendChild(c);
    }
  });

  function show(name) {
    Object.entries(views).forEach(([k, el]) => el.classList.toggle('on', k === name));
  }

  async function exists(file) {
    try {
      const r = await fetch(file, { method: 'HEAD', cache: 'no-store' });
      return r.ok;
    } catch (e) {
      return false; // 파일을 직접 연 경우(서버 없음) 등
    }
  }

  let token = 0; // 메뉴를 빠르게 연속으로 눌렀을 때 마지막 클릭만 반영
  async function open() {
    const id = location.hash.slice(1);
    const page = PAGES.find((p) => p.id === id) || PAGES[0];
    const my = ++token;

    document.querySelectorAll('#nav a').forEach((a) => {
      if (a.dataset.id === page.id) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    $('title').textContent = page.label;
    document.title = page.label + ' · 봉불사';

    if (!page.file) { show('home'); return; }

    show(null); // 확인하는 동안 이전 화면이 남아 보이지 않게 비움
    const ok = await exists(page.file);
    if (my !== token) return;
    if (ok) {
      $('frame').src = page.file;
      show('frame');
    } else {
      $('soon-name').textContent = page.label;
      show('soon');
    }
  }

  window.addEventListener('hashchange', open);
  open();

  /* ---------- 로그인 상태 표시 ----------
     회원 로그인(이름/전화번호)과 관리자 로그인(이메일/비밀번호)은 login.html 에서 따로 합니다.
     - 회원: sessionStorage['member'] = {name, phone}  → 다른 페이지는 window.top.getMember() 로 읽음
     - 관리자: sessionStorage['admin_token']          → 행사 관리·매출 페이지가 사용
     비회원은 로그인 없이 일정을 볼 수 있습니다. */
  function getMember() {
    try { return JSON.parse(sessionStorage.getItem('member') || 'null'); } catch (e) { return null; }
  }
  window.getMember = getMember;

  function adminActive() {
    try {
      const tk = sessionStorage.getItem('admin_token');
      if (!tk) return false;
      const exp = JSON.parse(atob(tk.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp;
      return exp * 1000 > Date.now();
    } catch (e) { return false; }
  }

  function reloadFrame() { const f = $('frame'); if (f.getAttribute('src')) f.contentWindow.location.reload(); }

  function renderWho() {
    const who = $('who');
    who.replaceChildren();
    const m = getMember(), admin = adminActive();
    const mk = (tag, cls, text) => { const e = document.createElement(tag); e.className = cls; e.textContent = text; return e; };

    if (m) who.append(mk('span', 'name', m.name + '님'));
    if (admin) {
      who.append(mk('span', 'admin-tag', '관리자'));
      const a1 = mk('a', 'btn ghost small', '행사 관리'); a1.href = 'menu.html';
      const a3 = mk('a', 'btn ghost small', '전체 예약'); a3.href = 'reservations.html';
      const a2 = mk('a', 'btn ghost small', '매출'); a2.href = 'sales.html';
      who.append(a1, a3, a2);
    }
    if (m || admin) {
      const out = mk('button', 'btn ghost small', '로그아웃'); out.type = 'button';
      out.addEventListener('click', () => {
        try { sessionStorage.removeItem('member'); sessionStorage.removeItem('admin_token'); } catch (e) {}
        renderWho();
        location.hash = '#login'; // 로그아웃하면 로그인 화면으로
      });
      who.append(out);
    } else {
      const b = mk('a', 'btn small', '로그인'); b.href = '#login';
      who.append(b);
    }
  }
  window.renderWho = renderWho;
  renderWho();

  /* ---------- 홈 사진 넘기기 ----------
     5초마다 왼쪽으로 한 장씩 넘어가고, 사진 아래 가운데의 작은 점과 좌우 화살표로도 넘길 수 있습니다.
     마지막 사진 다음에는 처음 사진이 이어서 왼쪽으로 들어옵니다.
     사진을 바꾸거나 더하려면 아래 SLIDES 목록만 고치면 됩니다. (pos = 사진이 잘릴 때 보여 줄 부분) */
  const SLIDES = [
    { src: 'images/main.jpg',    alt: '봉불사 법당 안, 금빛 부처님과 오색 연등이 보이는 모습', pos: '50% 50%' },
    { src: 'images/slide-2.jpg', alt: '오색 연등 아래 법당에서 불자들이 함께 기도하는 모습',   pos: '50% 40%' },
    { src: 'images/slide-3.jpg', alt: '법당에서 법회를 이끄는 스님의 모습',                     pos: '50% 38%' },
  ];
  (function initCarousel() {
    const car = $('carousel'), track = $('slides'), dotsBox = $('car-dots');
    const n = SLIDES.length;
    const INTERVAL = 5000;
    const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    const slide = (s, clone) => {
      const f = document.createElement('figure'); f.className = 'slide';
      const im = document.createElement('img'); im.src = s.src; im.alt = clone ? '' : s.alt; im.style.objectPosition = s.pos; im.draggable = false;
      if (clone) f.setAttribute('aria-hidden', 'true');
      f.append(im); return f;
    };
    SLIDES.forEach((s) => track.append(slide(s, false)));
    track.append(slide(SLIDES[0], true)); // 끝에 붙이는 복사본: 마지막 → 처음도 왼쪽으로 이어지게

    const dots = SLIDES.map((s, k) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'car-dot';
      b.setAttribute('aria-label', `${k + 1}번째 사진 보기`);
      b.addEventListener('click', () => { goTo(k); restart(); });
      dotsBox.append(b); return b;
    });

    let idx = 0, busy = false, paused = false, timer = null, settleTimer = null;
    const place = (i, animate) => { track.classList.toggle('no-anim', !animate); track.style.transform = `translateX(${-i * 100}%)`; };
    const paintDots = () => dots.forEach((d, k) => d.setAttribute('aria-current', String(k === idx % n)));

    function settle() { // 한 번 넘어간 뒤 정리: 복사본까지 왔으면 소리 없이 처음 사진으로 되돌림
      clearTimeout(settleTimer);
      if (idx === n) { idx = 0; place(0, false); }
      busy = false;
    }
    function goTo(i) {
      if (busy || i === idx) return;
      busy = true; idx = i; place(idx, !reduceMotion); paintDots();
      settleTimer = setTimeout(settle, reduceMotion ? 0 : 800);
    }
    const next = () => goTo(idx + 1);
    function prev() {
      if (busy) return;
      if (idx === 0) { idx = n; place(n, false); void track.offsetWidth; } // 처음에서 뒤로 → 복사본 위치로 몰래 이동 후 한 장 뒤로
      goTo(idx - 1);
    }
    track.addEventListener('transitionend', (e) => { if (e.target === track) settle(); });

    function restart() {
      clearInterval(timer);
      if (reduceMotion) return; // 움직임 줄이기를 켠 사용자에게는 자동으로 넘기지 않음
      timer = setInterval(() => { if (!document.hidden && !paused && car.offsetParent) next(); }, INTERVAL);
    }

    $('car-next').addEventListener('click', () => { next(); restart(); });
    $('car-prev').addEventListener('click', () => { prev(); restart(); });
    car.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { prev(); restart(); } else if (e.key === 'ArrowRight') { next(); restart(); }
    });
    // 마우스를 올리거나 키보드로 머무는 동안에는 잠시 멈춤
    car.addEventListener('mouseenter', () => { paused = true; });
    car.addEventListener('mouseleave', () => { paused = false; });
    car.addEventListener('focusin', () => { paused = true; });
    car.addEventListener('focusout', () => { paused = false; });
    // 휴대폰: 손가락으로 밀어서 넘기기
    let sx = null;
    car.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    car.addEventListener('touchend', (e) => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 40) { if (dx < 0) next(); else prev(); restart(); }
    }, { passive: true });

    place(0, false); paintDots(); restart();
  })();
</script>
</body>
</html>
