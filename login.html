<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { padding: 36px 40px 56px; }
  .wrap { max-width: 600px; margin: 0 auto; display: grid; gap: 18px; }
  .note { margin: 0; padding: 14px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }

  /* ---- 일주문: 지붕 · 공포 · 붉은 기둥 · 현판 · 돌계단. 안쪽에 로그인 칸이 놓입니다 ---- */
  .gate { filter: drop-shadow(0 10px 14px rgba(20,50,45,.25)); }
  .g-roof { display: block; width: 100%; height: auto; }
  .g-body { display: grid; grid-template-columns: 34px 1fr 34px; margin-top: -2px; }
  .pillar { position: relative; background: linear-gradient(90deg, #7d241d 0%, #c0443a 42%, #a3352a 70%, #7d241d 100%); }
  .pillar::after { content: ''; position: absolute; left: -5px; right: -5px; bottom: 0; height: 18px; background: linear-gradient(#b9b3a6, #8f897c); border-radius: 3px 3px 0 0; }
  .inside {
    padding: 0 0 20px; min-width: 0;
    background: radial-gradient(120% 70% at 50% 0%, #fffdf4 0%, #eaf2e4 55%, #d3e4d0 100%);
    box-shadow: inset 8px 0 10px -8px rgba(0,0,0,.35), inset -8px 0 10px -8px rgba(0,0,0,.35);
  }
  .g-beam { height: 12px; background: linear-gradient(#a3352a, #7d241d); border-bottom: 2px solid #d9a521; }
  .g-plaque {
    width: 58%; margin: 14px auto 6px; padding: 6px 10px; text-align: center;
    background: #1f1b17; border: 3px solid #c9982e; outline: 2px solid #1f1b17; outline-offset: -7px;
    color: #f6edd0; font-family: "Nanum Myeongjo","Noto Serif KR",serif; font-size: 1.5rem; font-weight: 800; letter-spacing: .35em; text-indent: .35em;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
  }
  .welcome { margin: 0 20px 14px; text-align: center; color: var(--brand-dark); font-size: .98rem; }
  .gate-card { display: grid; gap: 14px; margin: 0 20px; padding: 18px; background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 14px; }
  .gate-card h2 { margin: 0; font-size: 1.3rem; color: var(--brand-dark); }
  .gate-card p.sub { margin: 0; color: var(--muted); font-size: .95rem; }
  .gate-card form { display: grid; gap: 14px; }
  .g-steps { height: 38px; margin: 0 -6px; background: linear-gradient(#d4cfc4 0 34%, #bdb7aa 34% 67%, #a7a194 67%); clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%); }
  .tabs { display: flex; gap: 8px; }
  .tabbtn { flex: 1; min-height: 48px; padding: 8px 14px; font: inherit; font-weight: 700; border: 1.5px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); cursor: pointer; }
  .tabbtn.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .admin-link { text-align: center; margin: 0; }
  .admin-link button { background: none; border: 0; padding: 8px 12px; font: inherit; font-size: .95rem; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .admin-card { display: grid; gap: 14px; padding: 22px; background: var(--sand); border: 1px solid var(--line); border-radius: 16px; }
  .admin-card[hidden], #member-area[hidden] { display: none; }
  .admin-card h2 { margin: 0; font-size: 1.4rem; color: var(--brand-dark); }
  .admin-card form { display: grid; gap: 14px; }
  @media (max-width: 760px) {
    body { padding: 24px 12px 40px; }
    .g-body { grid-template-columns: 22px 1fr 22px; }
    .g-plaque { width: 70%; font-size: 1.25rem; }
    .welcome, .gate-card { margin-left: 10px; margin-right: 10px; }
    .gate-card { padding: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="note" id="status" hidden></p>

  <!-- 회원: 일주문을 들어서듯 -->
  <div id="member-area">
    <div class="gate">
      <svg class="g-roof" viewBox="0 0 600 142" role="img" aria-label="일주문 지붕" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="tile" width="14" height="100" patternUnits="userSpaceOnUse"><rect width="14" height="100" fill="#3d4b54"/><rect width="7" height="100" fill="#4b5b65"/></pattern>
          <pattern id="br" width="40" height="34" patternUnits="userSpaceOnUse">
            <rect width="40" height="34" fill="#1f7a6e"/>
            <rect x="3" y="3" width="34" height="9" rx="2" fill="#3a5bb8"/><rect x="8" y="14" width="24" height="7" rx="2" fill="#d9a521"/>
            <rect x="12" y="23" width="16" height="7" rx="2" fill="#c0392b"/><circle cx="20" cy="7.5" r="2.4" fill="#f6edd0"/>
          </pattern>
        </defs>
        <!-- 용마루 -->
        <rect x="150" y="6" width="300" height="14" rx="4" fill="#2c373e"/>
        <circle cx="148" cy="13" r="9" fill="#2c373e"/><circle cx="452" cy="13" r="9" fill="#2c373e"/>
        <!-- 지붕 면 (처마 끝이 살짝 들린 모양) -->
        <path d="M0 84 C42 84 72 70 100 42 L136 20 H464 L500 42 C528 70 558 84 600 84 L600 100 C560 102 524 98 494 88 H106 C76 98 40 102 0 100 Z" fill="url(#tile)"/>
        <path d="M0 84 C42 84 72 70 100 42 L136 20 H464 L500 42 C528 70 558 84 600 84" fill="none" stroke="#2c373e" stroke-width="3"/>
        <path d="M0 100 C40 102 76 98 106 88 H494 C524 98 560 102 600 100" fill="none" stroke="#e8e2cf" stroke-width="3"/>
        <!-- 서까래 끝 둥근 막새 -->
        <g fill="#e8e2cf" stroke="#9a2f26" stroke-width="2">
          <circle cx="22" cy="98" r="5"/><circle cx="62" cy="99" r="5"/><circle cx="104" cy="95" r="5"/><circle cx="496" cy="95" r="5"/><circle cx="538" cy="99" r="5"/><circle cx="578" cy="98" r="5"/>
        </g>
        <!-- 단청 공포 띠 -->
        <rect x="0" y="104" width="600" height="34" fill="url(#br)"/>
        <rect x="0" y="102" width="600" height="3" fill="#d9a521"/><rect x="0" y="138" width="600" height="4" fill="#d9a521"/>
      </svg>
      <div class="g-body">
        <div class="pillar" aria-hidden="true"></div>
        <div class="inside">
          <div class="g-beam" aria-hidden="true"></div>
          <div class="g-plaque" aria-hidden="true">봉불사</div>
          <p class="welcome">일주문을 들어서듯, 편안한 마음으로 들어오세요.</p>

          <section class="gate-card" aria-labelledby="h-member">
            <h2 id="h-member">회원</h2>
            <div class="tabs" role="tablist" aria-label="회원 메뉴">
              <button type="button" role="tab" id="tab-login" aria-selected="true" class="tabbtn on">로그인</button>
              <button type="button" role="tab" id="tab-signup" aria-selected="false" class="tabbtn">회원가입</button>
            </div>

            <form id="member-form">
              <p class="sub">처음이시면 위의 <b>회원가입</b>을 먼저 눌러 주세요.</p>
              <label class="f">이름<input id="m-name" type="text" autocomplete="username" required maxlength="50"></label>
              <label class="f">전화번호<input id="m-phone" type="tel" inputmode="numeric" autocomplete="tel" required maxlength="20" placeholder="예: 010-1234-5678"></label>
              <label class="f">비밀번호 (숫자 4~8자리)<input id="m-pw" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="가입하신 비밀번호"></label>
              <button class="btn" type="submit" id="m-go">회원 로그인</button>
              <div class="msg" id="m-msg" role="status"></div>
            </form>

            <form id="signup-form" hidden>
              <p class="sub">이름, 전화번호와 <b>간편 비밀번호(숫자 4~8자리)</b>를 정해 주세요. 한 번만 가입하시면 됩니다.</p>
              <label class="f">이름<input id="s-name" type="text" autocomplete="name" required maxlength="50"></label>
              <label class="f">전화번호<input id="s-phone" type="tel" inputmode="numeric" autocomplete="tel" required maxlength="20" placeholder="예: 010-1234-5678"></label>
              <label class="f">비밀번호 (숫자 4~8자리)<input id="s-pw" type="password" inputmode="numeric" autocomplete="new-password" required maxlength="8" pattern="[0-9]{4,8}" placeholder="숫자만 4~8자리"></label>
              <label class="f">비밀번호 확인<input id="s-pw2" type="password" inputmode="numeric" autocomplete="new-password" required maxlength="8" pattern="[0-9]{4,8}" placeholder="한 번 더 입력"></label>
              <div id="s-consent"></div>
              <button class="btn" type="submit" id="s-go">가입하기</button>
              <div class="msg" id="s-msg" role="status"></div>
            </form>
            <p class="hint" style="margin:0">입력하신 이름·전화번호는 예약 안내에만 사용합니다. <button type="button" class="privacy-link" id="privacy-open">개인정보 안내 보기</button><br>회원이 아니셔도 로그인 없이 일정을 볼 수 있습니다.</p>
          </section>
        </div>
        <div class="pillar" aria-hidden="true"></div>
      </div>
      <div class="g-steps" aria-hidden="true"></div>
    </div>
    <p class="admin-link"><button type="button" id="admin-open">관리자 로그인</button></p>
  </div>

  <!-- 관리자 로그인: 위의 '관리자 로그인'을 눌렀을 때만 보임 -->
  <section class="admin-card" id="admin-area" aria-labelledby="h-admin" hidden>
    <h2 id="h-admin">관리자 로그인</h2>
    <form id="admin-form">
      <label class="f">이메일<input id="a-email" type="email" autocomplete="username" required></label>
      <label class="f">비밀번호<input id="a-pw" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" id="a-go">관리자 로그인</button>
      <div class="msg" id="a-msg" role="status"></div>
    </form>
    <p class="admin-link"><button type="button" id="admin-close">← 회원 로그인으로 돌아가기</button></p>
  </section>
</div>

<script src="privacy.js"></script>
<script src="pay.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { const o = document.getElementById("privacy-open"); if (o) o.addEventListener("click", showPrivacyPopup); });
  // 공개용(publishable) 키입니다. 브라우저에 두어도 안전하며, 접근 범위는 DB의 RLS 규칙이 정합니다.
  const SUPABASE_URL = 'https://iixmdxfxayyjhnmngpve.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Thzc1yu4lKqvOKClASKUew_7FdA7lqv';
  const $ = (id) => document.getElementById(id);

  function say(el, text, kind) { el.className = 'msg' + (kind ? ' ' + kind : ''); el.textContent = text; }

  // 로그인 후 위쪽 표시를 새로 고치고 이동 (이 페이지가 index.html 안에서 열렸는지에 따라 다르게)
  function afterLogin(target) {
    const inShell = window.top !== window;
    if (inShell && window.top.renderWho) window.top.renderWho();
    if (target === 'myinfo') {
      if (inShell) window.top.location.hash = '#myinfo'; else location.href = 'index.html#myinfo';
    } else if (target === 'admin') {
      (inShell ? window.top : window).location.href = 'menu.html';
    } else if (inShell) {
      window.top.location.hash = '#home';
    } else {
      location.href = 'index.html';
    }
  }

  function showStatus() {
    const s = $('status');
    const parts = [];
    try {
      const m = JSON.parse(sessionStorage.getItem('member') || 'null');
      if (m && m.name) parts.push('회원 ' + m.name + '님으로 로그인되어 있습니다.');
      if (sessionStorage.getItem('admin_token')) parts.push('관리자로 로그인되어 있을 수 있습니다.');
    } catch (e) {}
    s.hidden = !parts.length;
    s.textContent = parts.join(' ');
  }
  showStatus();

  /* ---------- 관리자 로그인 칸 열기 / 닫기 ---------- */
  function showAdmin(on) {
    $('member-area').hidden = on; $('admin-area').hidden = !on;
    if (on) $('a-email').focus();
  }
  $('admin-open').addEventListener('click', () => showAdmin(true));
  $('admin-close').addEventListener('click', () => showAdmin(false));

  /* ---------- 회원: 탭(로그인 / 회원가입) ---------- */
  const consent = buildConsent(); // 개인정보 수집·이용 동의 (필수)
  $('s-consent').append(consent.el);
  function showTab(which) {
    const login = which === 'login';
    $('member-form').hidden = !login; $('signup-form').hidden = login;
    $('tab-login').classList.toggle('on', login); $('tab-signup').classList.toggle('on', !login);
    $('tab-login').setAttribute('aria-selected', String(login)); $('tab-signup').setAttribute('aria-selected', String(!login));
  }
  $('tab-login').addEventListener('click', () => showTab('login'));
  $('tab-signup').addEventListener('click', () => showTab('signup'));

  async function rpc(fn, args) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  function saveMember(r, phone) {
    try { sessionStorage.setItem('member', JSON.stringify({ name: r.name, phone, token: r.token || null })); } catch (e) {}
  }

  // 비밀번호를 여러 번 틀렸을 때: 대기 시간 동안 로그인 버튼을 막고 남은 시간을 보여 줌
  let waitTimer = null;
  function startWait(msg, go, seconds) {
    clearInterval(waitTimer);
    let left = Math.max(1, Math.ceil(seconds));
    go.disabled = true;
    const paint = () => {
      const mm = Math.floor(left / 60), ss = left % 60;
      say(msg, '비밀번호를 여러 번 틀려 잠시 막혔습니다. ' + (mm ? mm + '분 ' : '') + ss + '초 뒤에 다시 시도해 주세요.', 'err');
    };
    paint();
    waitTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) { clearInterval(waitTimer); waitTimer = null; go.disabled = false; say(msg, '이제 다시 로그인하실 수 있습니다.', 'ok'); return; }
      paint();
    }, 1000);
  }

  /* ---------- 회원 로그인 (이름 + 전화번호 + 비밀번호) ---------- */
  $('member-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = $('m-msg'), go = $('m-go');
    const name = $('m-name').value.trim(), phone = $('m-phone').value, pw = $('m-pw').value;
    go.disabled = true; say(msg, '확인 중…');
    try {
      const r = await rpc('member_login', { p_name: name, p_phone: phone, p_password: pw || null });
      if (r && r.ok) {
        saveMember(r, phone);
        $('m-pw').value = '';
        if (r.must_change) { // 관리자가 초기화한 임시 비밀번호 → 내 정보에서 새 비밀번호를 정하게 함
          say(msg, '임시 비밀번호로 로그인되었습니다. 내 정보에서 새 비밀번호를 정해 주세요.', 'ok');
          afterLogin('myinfo');
          return;
        }
        say(msg, '로그인되었습니다.', 'ok');
        afterLogin('member');
        return;
      }
      if (r && r.reason === 'locked_call') { // 15회 이상 틀림: 전화 문의 안내창
        say(msg, '비밀번호를 15회 이상 틀려 로그인이 잠겼습니다. 전화로 문의해 주세요.', 'err');
        noticePopup({ heading: '전화로 문의해 주세요', message: '비밀번호를 15회 이상 틀리셨습니다. 보안을 위해 로그인이 잠겼습니다. 전화(02-387-8578)로 문의해 주시면 임시 비밀번호를 알려 드립니다.', tel: '02-387-8578', telLabel: '📞 02-387-8578 전화하기' });
      }
      else if (r && r.reason === 'locked') startWait(msg, go, r.wait_seconds || 60); // 5회↑ 1분, 10회↑ 5분 대기
      else if (r && r.reason === 'need_password') { say(msg, '가입하신 회원입니다. 비밀번호(숫자)를 입력해 주세요.', 'err'); $('m-pw').focus(); }
      else if (r && r.reason === 'bad_login') {
        const n = r.tries || 0;
        say(msg, '이름, 전화번호 또는 비밀번호가 맞지 않습니다.' + (n >= 3 && n < 5 ? ' (' + n + '회 틀림 · 5회 이상 틀리면 1분간 로그인이 막힙니다)' : n >= 5 ? ' (' + n + '회 틀림)' : ''), 'err');
        if (n >= 5) { const w = n >= 15 ? 0 : n >= 10 ? 300 : 60; if (n >= 15) noticePopup({ heading: '전화로 문의해 주세요', message: '비밀번호를 15회 이상 틀리셨습니다. 보안을 위해 로그인이 잠겼습니다. 전화(02-387-8578)로 문의해 주세요.', tel: '02-387-8578', telLabel: '📞 02-387-8578 전화하기' }); else startWait(msg, go, w); }
      }
      else say(msg, '가입된 회원이 아닙니다. 위의 회원가입을 눌러 가입해 주세요. (회원이 아니셔도 일정은 볼 수 있습니다)', 'err');
    } catch (e) {
      say(msg, '로그인하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
    }
    if (!waitTimer) go.disabled = false;
  });

  /* ---------- 회원가입 (이름 + 전화번호 + 숫자 비밀번호 4~8자리) ---------- */
  $('signup-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = $('s-msg'), go = $('s-go');
    const name = $('s-name').value.trim(), phone = $('s-phone').value, pw = $('s-pw').value, pw2 = $('s-pw2').value;
    if (!name) { say(msg, '이름을 입력해 주세요.', 'err'); return; }
    if (phone.replace(/\D/g, '').length < 9) { say(msg, '전화번호를 정확히 입력해 주세요.', 'err'); return; }
    if (!/^[0-9]{4,8}$/.test(pw)) { say(msg, '비밀번호는 숫자 4~8자리로 입력해 주세요.', 'err'); $('s-pw').focus(); return; }
    if (pw !== pw2) { say(msg, '비밀번호 확인이 같지 않습니다. 다시 입력해 주세요.', 'err'); $('s-pw2').focus(); return; }
    if (!consent.isChecked()) { say(msg, '개인정보 수집·이용에 동의해 주세요. (체크칸을 눌러 주세요)', 'err'); consent.focus(); return; }
    go.disabled = true; say(msg, '가입하는 중…');
    try {
      const r = await rpc('member_signup', { p_name: name, p_phone: phone, p_password: pw, p_consent: true });
      if (r && r.ok) {
        saveMember(r, phone);
        $('s-pw').value = ''; $('s-pw2').value = '';
        say(msg, '가입되었습니다. 로그인된 상태로 이동합니다…', 'ok');
        afterLogin('member');
        return;
      }
      const why = r && r.reason;
      if (why === 'already_member') say(msg, '이미 가입된 이름·전화번호입니다. 위의 로그인에서 비밀번호로 로그인해 주세요. (비밀번호를 잊으셨으면 02-387-8578로 문의해 주세요)', 'err');
      else if (why === 'bad_password') say(msg, '비밀번호는 숫자 4~8자리로 입력해 주세요.', 'err');
      else if (why === 'bad_phone') say(msg, '전화번호를 정확히 입력해 주세요.', 'err');
      else if (why === 'busy') say(msg, '지금 가입 요청이 많습니다. 잠시 뒤에 다시 시도해 주세요.', 'err');
      else say(msg, '가입하지 못했습니다. 입력 내용을 확인해 주세요.', 'err');
    } catch (e) {
      say(msg, '가입하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
    }
    go.disabled = false;
  });

  /* ---------- 관리자 로그인 (이메일 + 비밀번호, Supabase 로그인) ---------- */
  $('admin-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = $('a-msg'), go = $('a-go');
    go.disabled = true; say(msg, '확인 중…');
    try {
      const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('a-email').value.trim(), password: $('a-pw').value }),
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok || !j.access_token) {
        say(msg, '이메일 또는 비밀번호가 올바르지 않습니다.', 'err');
        go.disabled = false;
        return;
      }
      try { sessionStorage.setItem('admin_token', j.access_token); } catch (e) {}
      $('a-pw').value = '';
      say(msg, '로그인되었습니다. 관리 화면으로 이동합니다…', 'ok');
      afterLogin('admin');
    } catch (e) {
      say(msg, '로그인하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
      go.disabled = false;
    }
  });
</script>
</body>
</html>
