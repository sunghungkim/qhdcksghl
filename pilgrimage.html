<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성지순례 일정</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { padding: 36px 40px 56px; }
  .wrap { max-width: 860px; }
  .reserve-box { display: grid; gap: 8px; }
  .people { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .people input { width: 5.2rem; min-height: 48px; text-align: center; }
  .reserve-panel { display: grid; gap: 14px; margin-top: 4px; padding: 16px; background: var(--sand); border-radius: 12px; }
  .reserve-id { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .reserve-comp { display: grid; gap: 12px; }
  .reserve-panel input[readonly] { background: #efe8da; color: var(--muted); }
  .reserve-sub { font-weight: 700; }
  .stops { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .stop { display: grid; gap: 2px; text-align: center; padding: 12px 10px; min-height: 64px; border: 2px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
  .stop:hover { border-color: var(--brand); }
  .stop-place { font-weight: 700; }
  .stop-time { font-size: 1.1rem; color: var(--brand-dark); font-weight: 700; }
  .stop.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stop.on .stop-time { color: #fff; }
  @media (max-width: 560px) { .reserve-id { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { body { padding: 24px 16px 40px; } }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="state">불러오는 중…</div></div>

<script src="paging.js"></script>
<script src="flyers.js"></script>
<script>
  // 공개용(publishable) 키입니다. 브라우저에 두어도 안전하며, 접근 범위는 DB의 RLS 규칙이 정합니다.
  const SUPABASE_URL = 'https://iixmdxfxayyjhnmngpve.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Thzc1yu4lKqvOKClASKUew_7FdA7lqv';

  const STATUS = { open: '모집중', closed: '마감', canceled: '취소' };
  const root = document.getElementById('root');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent 만 사용 → 데이터에 HTML이 있어도 실행되지 않음
    return e;
  }

  function fmtDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    const w = ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
    return `${y}년 ${m}월 ${d}일 (${w})`;
  }

  function card(p, past) {
    const item = el('article', 'item' + (past ? ' past' : ''));
    const top = el('div', 'top');
    top.append(el('h3', 'title', p.title), el('span', 'badge ' + p.status, STATUS[p.status] || p.status));
    item.append(top);

    const meta = el('div', 'meta');
    meta.append(el('span', null, '📅 ' + fmtDate(p.trip_date)), el('span', null, '📍 ' + p.place));
    if (p.price != null) meta.append(el('span', null, '💰 ' + (p.price === 0 ? '무료' : Number(p.price).toLocaleString('ko-KR') + '원')));
    if (p.capacity != null) meta.append(el('span', null, '👥 정원 ' + p.capacity + '명'));
    item.append(meta);

    if (p.description) item.append(el('p', 'desc', p.description));

    if (p.status === 'open' && !past) item.append(reserveBox(p));
    return item;
  }

  /* ---------- 예약하기: 회원만 가능, 누르면 "내 예약"에 추가됩니다 ---------- */
  function topGo(hash) { try { window.top.location.hash = hash; } catch (e) { location.href = 'index.html' + hash; } }
  function currentMember() { try { return window.top.getMember ? window.top.getMember() : null; } catch (e) { return null; } }

  // 차량 탑승지 목록: [{place, time}] — 없으면 빈 배열
  function stopsOf(p) { return Array.isArray(p.boardings) ? p.boardings.filter((b) => b && b.place) : []; }
  const stopLabel = (b) => (b.time ? b.place + ' ' + b.time : b.place);

  function reserveBox(p) {
    const stops = stopsOf(p);
    const box = el('div', 'reserve-box');
    const open = el('button', 'btn', '예약 신청서 쓰기'); open.type = 'button';
    open.setAttribute('aria-expanded', 'false');
    box.append(open);

    const panel = el('div', 'reserve-panel'); panel.hidden = true;
    const m0 = currentMember();
    const gate = el('div', 'msg'); gate.setAttribute('role', 'status');
    box.append(gate);

    const mkField = (labelText, type, value, ph, ac) => {
      const l = el('label', 'f', labelText);
      const i = el('input'); i.type = type; i.value = value || ''; i.placeholder = ph;
      if (ac) i.autocomplete = ac;
      if (type === 'tel') i.inputMode = 'tel';
      l.append(i);
      return [l, i];
    };
    // 순서: ① 인원 → ② 이름·전화번호 → ③ 차량 탑승지 → 예약하기
    panel.append(el('div', 'reserve-sub', '① 인원을 먼저 정해 주세요'));
    const lab = el('label', 'people', '인원 ');
    const num = el('input'); num.type = 'number'; num.min = 1; num.max = 100; num.step = 1; num.value = 1;
    num.setAttribute('aria-label', '예약 인원(명)');
    lab.append(num, document.createTextNode(' 명'));
    panel.append(lab);
    // 1번째 분 = 로그인한 회원 본인 (고칠 수 없음)
    panel.append(el('div', 'reserve-sub', '② 이름과 전화번호 (1번째 분은 로그인한 회원)'));
    const [nameL, nameI] = mkField('이름', 'text', m0 && m0.name, '', 'name');
    const [phoneL, phoneI] = mkField('전화번호', 'tel', m0 && m0.phone, '', 'tel');
    nameI.readOnly = true; phoneI.readOnly = true;
    const idRow = el('div', 'reserve-id'); idRow.append(nameL, phoneL);
    panel.append(idRow);
    const comp = el('div', 'reserve-comp'); // 인원이 2명 이상이면 동행하시는 분 칸이 생깁니다
    panel.append(comp);

    // 차량 탑승지 버튼 (장소 + 탑승시간)
    let chosen = null;
    if (stops.length) {
      panel.append(el('div', 'reserve-sub', '③ 차량 탑승지를 눌러 선택하세요'));
      const grp = el('div', 'stops'); grp.setAttribute('role', 'radiogroup'); grp.setAttribute('aria-label', '차량 탑승지');
      stops.forEach((s) => {
        const b = el('button', 'stop');
        b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false');
        b.append(el('span', 'stop-place', s.place), el('span', 'stop-time', s.time || ''));
        b.addEventListener('click', () => {
          chosen = stopLabel(s);
          grp.querySelectorAll('.stop').forEach((x) => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on ? 'true' : 'false'); });
        });
        grp.append(b);
      });
      panel.append(grp);
    }

    const b = el('button', 'btn', '예약하기'); b.type = 'button';
    const row = el('div', 'actions'); row.append(b);
    const msg = el('div', 'msg'); msg.setAttribute('role', 'status');
    panel.append(row, msg);
    box.append(panel);

    // 인원 수에 맞춰 동행인(2번째 분부터) 이름·전화번호 칸을 만들고 줄입니다 (이미 쓴 내용은 남김)
    const compInputs = [];
    const syncComp = () => {
      const n = Math.max(1, Math.min(100, Math.floor(Number(num.value)) || 1));
      while (compInputs.length < n - 1) {
        const k = compInputs.length + 2;
        const wrap = el('div', 'reserve-id');
        const [l1, i1] = mkField(k + '번째 분 이름', 'text', '', '예: 홍길동');
        const [l2, i2] = mkField(k + '번째 분 전화번호', 'tel', '', '예: 010-1234-5678');
        i1.maxLength = 50;
        wrap.append(l1, l2);
        compInputs.push({ wrap, name: i1, phone: i2 });
      }
      while (compInputs.length > n - 1) compInputs.pop();
      comp.replaceChildren(...compInputs.map((c) => c.wrap));
    };
    num.addEventListener('input', syncComp);
    num.addEventListener('change', syncComp);

    const say = (text, kind, linkText, hash) => {
      const target = panel.hidden ? gate : msg;
      target.className = 'msg' + (kind ? ' ' + kind : '');
      target.replaceChildren(text);
      if (linkText) {
        const a = el('button', 'btn ghost small', linkText); a.type = 'button';
        a.style.marginLeft = '10px';
        a.addEventListener('click', () => topGo(hash));
        target.append(a);
      }
    };

    open.addEventListener('click', () => {
      if (panel.hidden) {
        if (!currentMember()) { say('예약은 회원 로그인 후에 할 수 있습니다.', 'err', '로그인하기', '#login'); return; }
        const mm = currentMember();
        nameI.value = mm.name; phoneI.value = mm.phone;
        gate.replaceChildren();
        panel.hidden = false;
      } else panel.hidden = true;
      open.setAttribute('aria-expanded', String(!panel.hidden));
      open.textContent = panel.hidden ? '예약 신청서 쓰기' : '신청서 닫기';
    });

    b.addEventListener('click', async () => {
      const m = currentMember();
      if (!m) { panel.hidden = true; open.textContent = '예약 신청서 쓰기'; say('예약은 회원 로그인 후에 할 수 있습니다.', 'err', '로그인하기', '#login'); return; }
      const name = m.name, phone = m.phone;
      if (stops.length && !chosen) { say('차량 탑승지를 선택해 주세요.', 'err'); return; }
      const people = Number(num.value);
      if (!Number.isInteger(people) || people < 1 || people > 100) { say('인원은 1명 이상으로 입력해 주세요.', 'err'); return; }
      syncComp();
      const companions = [];
      for (let i = 0; i < compInputs.length; i++) {
        const c = compInputs[i], nm = c.name.value.trim(), ph = c.phone.value.trim();
        if (!nm) { say((i + 2) + '번째 분 이름을 입력해 주세요.', 'err'); c.name.focus(); return; }
        if (ph.replace(/\D/g, '').length < 9) { say((i + 2) + '번째 분 전화번호를 정확히 입력해 주세요.', 'err'); c.phone.focus(); return; }
        companions.push({ name: nm, phone: ph });
      }
      b.disabled = true; say('예약하는 중…');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/member_reserve`, {
          method: 'POST',
          headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_name: name, p_phone: phone, p_pilgrimage_id: p.id, p_people: people, p_boarding: chosen, p_companions: companions }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const r = await res.json();
        if (r.ok) say('예약되었습니다.' + (chosen ? ' 탑승지: ' + chosen + '.' : '') + ' 내 예약에 추가했어요.', 'ok', '내 예약 보기', '#reserve');
        else if (r.reason === 'duplicate') say('이미 예약하신 일정입니다.', 'err', '내 예약 보기', '#reserve');
        else if (r.reason === 'closed') say('마감되었거나 지난 일정입니다.', 'err');
        else if (r.reason === 'full') say('남은 자리가 부족합니다.', 'err');
        else if (r.reason === 'need_boarding') say('차량 탑승지를 선택해 주세요.', 'err');
        else if (r.reason === 'need_companions') say('인원 수에 맞게 모든 분의 이름과 전화번호를 입력해 주세요.', 'err');
        else if (r.reason === 'locked') say('잠시 막혔습니다. 10분 뒤에 다시 시도해 주세요.', 'err');
        else say('로그인 정보를 확인해 주세요.', 'err', '로그인하기', '#login');
      } catch (e) {
        say('예약하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
      }
      b.disabled = false;
    });
    return box;
  }

  async function load() {
    root.replaceChildren(el('div', 'state', '불러오는 중…'));
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pilgrimages?select=*&order=trip_date.asc`, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();

      const today = new Date();
      const t = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const upcoming = rows.filter((r) => r.trip_date >= t);
      const past = rows.filter((r) => r.trip_date < t).reverse();

      root.replaceChildren();
      if (!rows.length) { root.append(el('div', 'state', '등록된 성지순례 일정이 아직 없습니다.')); return; }
      // 검색 + 한 페이지에 5개씩
      const dateWords = (s) => { const [y, m, d] = s.split('-').map(Number); return `${s} ${y}년 ${m}월 ${d}일 ${m}월${d}일 ${m}/${d}`; };
      const haystack = (r) => [r.title, r.place, r.description, r.price === 0 ? '무료' : r.price, STATUS[r.status], dateWords(r.trip_date)].join(' ');
      const results = el('div');
      const sb = searchBox({
        placeholder: '예: 해맞이, 통도사, 12월 20일, 무박',
        onSearch: (q) => {
          const hit = rows.filter((r) => matchesQuery(haystack(r), q));
          sb.setInfo(q ? `"${q}" 검색 결과 ${hit.length}건` : `전체 ${rows.length}건`);
          if (!hit.length) { results.replaceChildren(el('div', 'state', '검색 결과가 없습니다. 다른 낱말로 찾아보세요.')); return; }
          paginate(results, [
            { title: '다가오는 일정', rows: hit.filter((r) => r.trip_date >= t), past: false, emptyText: q ? '' : '다가오는 일정이 아직 없습니다.' },
            { title: '지난 일정', rows: hit.filter((r) => r.trip_date < t).reverse(), past: true },
          ], (p, g) => card(p, g.past), { perPage: 5 });
        },
      });
      const flyers = buildFlyerBox(); // 일정 검색 위의 전단 사진 (flyers.js 에서 바꿈)
      if (flyers) root.append(flyers);
      root.append(sb.el, results);
      sb.setInfo(`전체 ${rows.length}건`);
      paginate(results, [
        { title: '다가오는 일정', rows: upcoming, past: false, emptyText: '다가오는 일정이 아직 없습니다.' },
        { title: '지난 일정', rows: past, past: true },
      ], (p, g) => card(p, g.past), { perPage: 5 });
    } catch (e) {
      const box = el('div', 'state', '일정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      const b = el('button', 'btn ghost', '다시 불러오기');
      b.type = 'button';
      b.addEventListener('click', load);
      box.append(document.createElement('br'), b);
      root.replaceChildren(box);
    }
  }
  load();
</script>
</body>
</html>
