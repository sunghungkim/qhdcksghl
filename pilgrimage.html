<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성지순례 일정</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { padding: 36px 40px 56px; }
  .wrap { max-width: 860px; }
  .reserve-box { display: grid; gap: 8px; }
  .people { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .people input { width: 5.2rem; min-height: 48px; text-align: center; }
  @media (max-width: 760px) { body { padding: 24px 16px 40px; } }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="state">불러오는 중…</div></div>

<script src="paging.js"></script>
<script>
  // 공개용(publishable) 키입니다. 브라우저에 두어도 안전하며, 접근 범위는 DB의 RLS 규칙이 정합니다.
  const SUPABASE_URL = 'https://iixmdxfxayyjhnmngpve.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Thzc1yu4lKqvOKClASKUew_7FdA7lqv';

  const STATUS = { open: '모집중', closed: '마감', canceled: '취소' };
  const root = document.getElementById('root');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent 만 사용 → 데이터에 HTML이 있어도 실행되지 않음
    return e;
  }

  function fmtDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    const w = ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
    return `${y}년 ${m}월 ${d}일 (${w})`;
  }

  function card(p, past) {
    const item = el('article', 'item' + (past ? ' past' : ''));
    const top = el('div', 'top');
    top.append(el('h3', 'title', p.title), el('span', 'badge ' + p.status, STATUS[p.status] || p.status));
    item.append(top);

    const meta = el('div', 'meta');
    meta.append(el('span', null, '📅 ' + fmtDate(p.trip_date)), el('span', null, '📍 ' + p.place));
    if (p.price != null) meta.append(el('span', null, '💰 ' + (p.price === 0 ? '무료' : Number(p.price).toLocaleString('ko-KR') + '원')));
    if (p.capacity != null) meta.append(el('span', null, '👥 정원 ' + p.capacity + '명'));
    item.append(meta);

    if (p.description) item.append(el('p', 'desc', p.description));

    if (p.status === 'open' && !past) item.append(reserveBox(p));
    return item;
  }

  /* ---------- 예약하기: 회원만 가능, 누르면 "내 예약"에 추가됩니다 ---------- */
  function topGo(hash) { try { window.top.location.hash = hash; } catch (e) { location.href = 'index.html' + hash; } }
  function currentMember() { try { return window.top.getMember ? window.top.getMember() : null; } catch (e) { return null; } }

  function reserveBox(p) {
    const box = el('div', 'reserve-box');
    const row = el('div', 'actions');
    const lab = el('label', 'people', '인원 ');
    const num = el('input'); num.type = 'number'; num.min = 1; num.max = 100; num.step = 1; num.value = 1;
    num.setAttribute('aria-label', '예약 인원(명)');
    lab.append(num, document.createTextNode(' 명'));
    const b = el('button', 'btn', '예약하기'); b.type = 'button';
    row.append(lab, b);
    const msg = el('div', 'msg'); msg.setAttribute('role', 'status');
    box.append(row, msg);

    const say = (text, kind, linkText, hash) => {
      msg.className = 'msg' + (kind ? ' ' + kind : '');
      msg.replaceChildren(text);
      if (linkText) {
        const a = el('button', 'btn ghost small', linkText); a.type = 'button';
        a.style.marginLeft = '10px';
        a.addEventListener('click', () => topGo(hash));
        msg.append(a);
      }
    };

    b.addEventListener('click', async () => {
      const m = currentMember();
      if (!m) { say('회원 로그인 후 예약할 수 있습니다.', 'err', '로그인하기', '#login'); return; }
      const people = Number(num.value);
      if (!Number.isInteger(people) || people < 1 || people > 100) { say('인원은 1명 이상으로 입력해 주세요.', 'err'); return; }
      b.disabled = true; say('예약하는 중…');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/member_reserve`, {
          method: 'POST',
          headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_name: m.name, p_phone: m.phone, p_pilgrimage_id: p.id, p_people: people }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const r = await res.json();
        if (r.ok) say('예약되었습니다. 내 예약에 추가했어요.', 'ok', '내 예약 보기', '#reserve');
        else if (r.reason === 'duplicate') say('이미 예약하신 일정입니다.', 'err', '내 예약 보기', '#reserve');
        else if (r.reason === 'closed') say('마감되었거나 지난 일정입니다.', 'err');
        else if (r.reason === 'full') say('남은 자리가 부족합니다.', 'err');
        else if (r.reason === 'locked') say('잠시 막혔습니다. 10분 뒤에 다시 시도해 주세요.', 'err');
        else say('로그인 정보를 확인해 주세요.', 'err', '로그인하기', '#login');
      } catch (e) {
        say('예약하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
      }
      b.disabled = false;
    });
    return box;
  }

  async function load() {
    root.replaceChildren(el('div', 'state', '불러오는 중…'));
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pilgrimages?select=*&order=trip_date.asc`, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();

      const today = new Date();
      const t = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const upcoming = rows.filter((r) => r.trip_date >= t);
      const past = rows.filter((r) => r.trip_date < t).reverse();

      root.replaceChildren();
      if (!rows.length) { root.append(el('div', 'state', '등록된 성지순례 일정이 아직 없습니다.')); return; }
      // 한 페이지에 5개씩
      paginate(root, [
        { title: '다가오는 일정', rows: upcoming, past: false, emptyText: '다가오는 일정이 아직 없습니다.' },
        { title: '지난 일정', rows: past, past: true },
      ], (p, g) => card(p, g.past), { perPage: 5 });
    } catch (e) {
      const box = el('div', 'state', '일정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      const b = el('button', 'btn ghost', '다시 불러오기');
      b.type = 'button';
      b.addEventListener('click', load);
      box.append(document.createElement('br'), b);
      root.replaceChildren(box);
    }
  }
  load();
</script>
</body>
</html>
