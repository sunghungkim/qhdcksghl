<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성지순례 일정</title>
<style>
  :root {
    --bg: #faf6ef;
    --panel: #ffffff;
    --text: #2b2118;
    --muted: #7a6a5b;
    --line: #e6dccd;
    --accent: #c8862a;
    --ok-bg: #e4f1e1; --ok-fg: #2f6b2a;
    --off-bg: #eee8df; --off-fg: #6b5d4f;
    --bad-bg: #f7dfdc; --bad-fg: #9b2f25;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 32px 40px;
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 820px; }
  h2 { font-size: 20px; margin: 28px 0 12px; }
  h2:first-child { margin-top: 0; }
  .list { display: grid; gap: 14px; }
  .item {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    display: grid;
    gap: 10px;
  }
  .item.past { opacity: .7; }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .title { font-size: 18px; font-weight: 700; margin: 0; }
  .badge { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .badge.open { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.closed { background: var(--off-bg); color: var(--off-fg); }
  .badge.canceled { background: var(--bad-bg); color: var(--bad-fg); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 15px; }
  .desc { margin: 0; line-height: 1.6; white-space: pre-line; }
  .actions { margin-top: 4px; }
  button.reserve {
    font: inherit; font-weight: 700;
    background: var(--accent); color: #fff;
    border: 0; border-radius: 10px;
    padding: 10px 18px; cursor: pointer;
  }
  button.reserve:hover { filter: brightness(.95); }
  button.reserve:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .state { padding: 40px 0; text-align: center; color: var(--muted); }
  .state button { margin-top: 12px; font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  @media (max-width: 720px) { body { padding: 20px 16px 32px; } }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="state">불러오는 중…</div></div>

<script>
  // 공개용(publishable) 키입니다. 브라우저에 두어도 안전하며, 접근 범위는 DB의 RLS 규칙이 정합니다.
  const SUPABASE_URL = 'https://iixmdxfxayyjhnmngpve.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Thzc1yu4lKqvOKClASKUew_7FdA7lqv';

  const STATUS = { open: '모집중', closed: '마감', canceled: '취소' };
  const root = document.getElementById('root');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent 만 사용 → 데이터에 HTML이 있어도 실행되지 않음
    return e;
  }

  function fmtDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    const w = ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
    return `${y}년 ${m}월 ${d}일 (${w})`;
  }

  function card(p, past) {
    const item = el('article', 'item' + (past ? ' past' : ''));
    const top = el('div', 'top');
    top.append(el('h3', 'title', p.title), el('span', 'badge ' + p.status, STATUS[p.status] || p.status));
    item.append(top);

    const meta = el('div', 'meta');
    meta.append(el('span', null, '📅 ' + fmtDate(p.trip_date)), el('span', null, '📍 ' + p.place));
    if (p.price != null) meta.append(el('span', null, '💰 ' + Number(p.price).toLocaleString('ko-KR') + '원'));
    if (p.capacity != null) meta.append(el('span', null, '👥 정원 ' + p.capacity + '명'));
    item.append(meta);

    if (p.description) item.append(el('p', 'desc', p.description));

    if (p.status === 'open' && !past) {
      const act = el('div', 'actions');
      const b = el('button', 'reserve', '예약하기');
      b.type = 'button';
      b.addEventListener('click', () => { window.top.location.hash = '#reserve'; });
      act.append(b);
      item.append(act);
    }
    return item;
  }

  function section(title, items, past) {
    const frag = document.createDocumentFragment();
    frag.append(el('h2', null, title));
    const list = el('div', 'list');
    items.forEach((p) => list.append(card(p, past)));
    frag.append(list);
    return frag;
  }

  async function load() {
    root.replaceChildren(el('div', 'state', '불러오는 중…'));
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pilgrimages?select=*&order=trip_date.asc`, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();

      const today = new Date();
      const t = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const upcoming = rows.filter((r) => r.trip_date >= t);
      const past = rows.filter((r) => r.trip_date < t).reverse();

      root.replaceChildren();
      if (!rows.length) { root.append(el('div', 'state', '등록된 성지순례 일정이 아직 없습니다.')); return; }
      if (upcoming.length) root.append(section('다가오는 일정', upcoming, false));
      else root.append(el('div', 'state', '다가오는 일정이 아직 없습니다.'));
      if (past.length) root.append(section('지난 일정', past, true));
    } catch (e) {
      const box = el('div', 'state', '일정을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      const b = el('button', null, '다시 불러오기');
      b.type = 'button';
      b.addEventListener('click', load);
      box.append(document.createElement('br'), b);
      root.replaceChildren(box);
    }
  }
  load();
</script>
</body>
</html>
