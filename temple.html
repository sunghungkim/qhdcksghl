<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>절 소개</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { padding: 36px 40px 56px; }
  .wrap { max-width: 860px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; } /* 긴 내용이 있어도 칸이 화면보다 넓어지지 않게 */
  h2.name { margin: 0; font-size: 2rem; color: var(--brand-dark); }
  .intro { margin: 0; line-height: 1.85; white-space: pre-line; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 12px 24px; align-items: baseline; }
  dt { color: var(--muted); font-size: .95rem; }
  dd { margin: 0; font-size: 1.15rem; line-height: 1.6; min-width: 0; overflow-wrap: anywhere; } /* 긴 인터넷 주소는 화면 끝에서 줄바꿈 */
  dd a { font-weight: 700; }
  .mapbox { display: grid; gap: 10px; }
  .mapbox iframe { width: 100%; height: 240px; border: 1px solid var(--line); border-radius: 14px; background: var(--sand); }
  .maptabs { display: flex; gap: 8px; }
  .btn.naver { background: #0a7d3b; }
  .btn.naver:hover { background: #07622e; }

  /* ---------- 봉찬회에 대하여 (역사) ---------- */
  .story { display: grid; gap: 22px; margin-top: 12px; }
  .story-head { padding-bottom: 14px; border-bottom: 2px solid var(--line); }
  .story-title { margin: 0; font-size: 1.9rem; color: var(--brand-dark); }
  .story-sub { margin: 6px 0 0; color: var(--muted); font-family: var(--serif); font-size: 1.1rem; }
  .story-nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .story-part { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 14px; scroll-margin-top: 12px; }
  .story-h3 { margin: 0; font-size: 1.45rem; color: var(--brand-dark); padding-left: 12px; border-left: 5px solid var(--gold); }
  .story-h4 { margin: 10px 0 0; font-size: 1.15rem; font-family: var(--sans); color: var(--brand); }
  .prose { margin: 0; line-height: 2; font-size: 1.02rem; word-break: keep-all; overflow-wrap: break-word; }

  /* 절 소개 동영상 */
  .video-box { position: relative; border-radius: 16px; overflow: hidden; background: #000; }
  .video-box video { display: block; width: 100%; max-height: 80vh; background: #000; }
  .video-box .vfail { padding: 40px 16px; text-align: center; color: #fff; }
  /* 가운데 큰 버튼(다시 보기 / 재생): 아래쪽 조절줄은 가리지 않음 */
  .video-overlay { position: absolute; inset: 0 0 56px 0; display: grid; place-items: center; background: rgba(0,0,0,.4); pointer-events: none; }
  .video-big {
    pointer-events: auto; width: 116px; height: 116px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9);
    background: rgba(20,12,6,.7); color: #fff; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 2px; padding: 0; font: inherit;
  }
  .video-big:hover { background: rgba(140,74,47,.9); }
  .video-big-icon { font-size: 2.6rem; line-height: 1; }
  .video-big-text { font-size: 1rem; font-weight: 700; }
  /* 소리 켜기 */
  .video-sound { position: absolute; top: 12px; right: 12px; z-index: 2; min-height: 44px; padding: 8px 16px; border: 2px solid rgba(255,255,255,.85); border-radius: 999px; background: rgba(20,12,6,.72); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .video-sound:hover { background: rgba(140,74,47,.92); }
  @media (max-width: 760px) { .video-big { width: 96px; height: 96px; } .video-big-icon { font-size: 2.1rem; } .video-big-text { font-size: .9rem; } .video-overlay { inset: 0 0 48px 0; } }

  /* 연혁: 세로 시간 순서 */
  .timeline { list-style: none; margin: 4px 0 0; padding: 0 0 0 6px; }
  .timeline li { position: relative; display: grid; grid-template-columns: 5.2rem 1fr; gap: 4px 14px; padding: 0 0 20px 24px; border-left: 3px solid var(--line); }
  .timeline li:last-child { padding-bottom: 0; border-left-color: transparent; }
  .timeline li::before { content: ''; position: absolute; left: -9px; top: .5rem; width: 15px; height: 15px; border-radius: 50%; background: var(--brand); border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--brand); }
  .tl-year { font-family: var(--serif); font-weight: 700; font-size: 1.25rem; color: var(--brand-dark); }
  .tl-what { line-height: 1.75; font-size: 1.05rem; }

  /* 의미: 큰 한자 세 글자 */
  .hanja-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .hanja { text-align: center; background: var(--sand); border-radius: 14px; padding: 16px 8px; }
  .hanja-ch { font-family: var(--serif); font-size: 3.2rem; font-weight: 700; line-height: 1.1; color: var(--brand-dark); }
  .hanja-read { margin-top: 6px; color: var(--muted); }

  @media (max-width: 760px) {
    body { padding: 20px 12px 36px; }
    dl { grid-template-columns: 1fr; gap: 2px; } dd { margin-bottom: 12px; }
    .story-part { padding: 18px 16px; }
    .story-title { font-size: 1.55rem; }
    .timeline li { grid-template-columns: 1fr; gap: 2px; padding-left: 20px; }
    .hanja-ch { font-size: 2.5rem; }
    .hanja-read { font-size: .85rem; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="state">불러오는 중…</div></div>

<script src="story.js"></script>
<script src="totop.js"></script>
<script>
  // 공개용(publishable) 키입니다. 브라우저에 두어도 안전하며, 접근 범위는 DB의 RLS 규칙이 정합니다.
  const SUPABASE_URL = 'https://iixmdxfxayyjhnmngpve.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Thzc1yu4lKqvOKClASKUew_7FdA7lqv';
  // 바깥 링크 (보이는 순서대로). 주소가 바뀌면 여기만 고치면 됩니다.
  const LINKS = [
    ['밴드', 'https://www.band.us/band/87823665/post'],
    ['블로그', 'https://blog.naver.com/stda11'],
    ['인스타', 'https://www.instagram.com/bongbulsa_1982'],
    ['카페', 'https://cafe.daum.net/bongchanhoe'],
  ];
  const root = document.getElementById('root');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent 만 사용
    return e;
  }

  // 절 소개 동영상 파일. 다른 동영상으로 바꾸려면 video 폴더의 파일을 바꾸거나 이 주소를 고치면 됩니다.
  const VIDEO_SRC = 'video/temple-intro.mp4';

  function buildIntroVideo() {
    const box = el('div', 'video-box');
    const v = document.createElement('video');
    v.controls = true;              // 재생·정지·소리·전체화면 조절
    v.playsInline = true;           // 휴대폰에서 화면 안에서 재생
    v.preload = 'auto';
    // 이 페이지에 들어오면 자동으로 재생됩니다. 브라우저는 소리가 나는 영상의 자동 재생을 막기 때문에
    // 소리는 끈 채로 시작하고, 영상 위의 "소리 켜기" 버튼(또는 아래 조절줄의 소리 버튼)으로 켭니다.
    v.muted = true; v.setAttribute('muted', '');
    v.setAttribute('aria-label', '봉불사 절 소개 동영상');
    const s = document.createElement('source');
    s.src = VIDEO_SRC; s.type = 'video/mp4';
    s.addEventListener('error', () => { box.replaceChildren(el('div', 'vfail', '동영상을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.')); });
    v.append(s, '이 브라우저에서는 동영상을 재생할 수 없습니다.');

    // 가운데 큰 버튼: 끝나면 "다시 보기", 자동 재생이 막혔을 때는 "재생"
    const ov = el('div', 'video-overlay'); ov.hidden = true;
    const big = el('button', 'video-big'); big.type = 'button';
    const icon = el('span', 'video-big-icon', '↻'); icon.setAttribute('aria-hidden', 'true');
    const txt = el('span', 'video-big-text', '다시 보기');
    big.append(icon, txt); ov.append(big);
    const showOverlay = (mode) => {
      const replay = mode === 'replay';
      icon.textContent = replay ? '↻' : '▶';
      txt.textContent = replay ? '다시 보기' : '재생';
      big.setAttribute('aria-label', replay ? '동영상 처음부터 다시 보기' : '동영상 재생');
      ov.hidden = false;
      big.focus({ preventScroll: true });
    };
    big.addEventListener('click', () => { if (v.ended) v.currentTime = 0; v.play().catch(() => {}); });
    v.addEventListener('play', () => { ov.hidden = true; });
    v.addEventListener('ended', () => showOverlay('replay'));

    // 소리 켜기 버튼 (소리를 끈 채 재생되는 동안만 보임)
    const sound = el('button', 'video-sound', '🔇 소리 켜기'); sound.type = 'button'; sound.hidden = true;
    const syncSound = () => { sound.hidden = !v.muted || v.paused || v.ended; };
    ['play', 'pause', 'ended', 'volumechange'].forEach((ev) => v.addEventListener(ev, syncSound));
    sound.addEventListener('click', () => { v.muted = false; v.removeAttribute('muted'); if (v.volume === 0) v.volume = 1; syncSound(); });

    // 자동 재생 (움직임 줄이기를 켠 기기에서는 자동으로 틀지 않고 "재생" 버튼만 보여 줌)
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    v.addEventListener('loadedmetadata', () => {
      if (reduce) { showOverlay('play'); return; }
      const p = v.play();
      if (p && p.catch) p.catch(() => showOverlay('play')); // 브라우저가 막으면 "재생" 버튼
    }, { once: true });

    box.append(v, ov, sound);
    return box;
  }

  function render(t) {
    root.replaceChildren();

    // 사진 자리: 절 소개 동영상 (사진들은 홈 화면에서 넘어가며 보입니다)
    root.append(buildIntroVideo());

    // 봉찬회에 대하여 (역사)를 사진 바로 아래, 연락처 카드보다 위에 둠. 글은 story.js
    root.append(buildStory([['temple-info', '연락처 · 오시는 길']]));

    const card = el('section', 'card');
    card.id = 'temple-info'; card.style.scrollMarginTop = '12px';
    card.style.display = 'grid'; card.style.gap = '18px';
    card.append(el('h2', 'name', '봉불사 · 봉찬회'));
    if (t.intro) card.append(el('p', 'intro', t.intro));

    const dl = el('dl');
    // 블로그 · 카페 · 인스타 (주소 위, 이 순서). 눌러서 새 창에서 엽니다.
    LINKS.forEach(([label, url]) => {
      const dd = el('dd');
      const a = el('a', null, url.replace(/^https?:\/\//, '')); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; // 보이는 글자는 https:// 를 뺀 짧은 모양
      dd.append(a); dl.append(el('dt', null, label), dd);
    });
    if (t.address) dl.append(el('dt', null, '주소'), el('dd', null, t.address));
    if (t.phone) {
      const dd = el('dd');
      const a = el('a', null, t.phone); a.href = 'tel:' + t.phone.replace(/[^0-9+]/g, '');
      dd.append(a); dl.append(el('dt', null, '문의 및 접수'), dd);
    }
    if (dl.children.length) card.append(dl);

    // 작은 위치 사진: 주소로 찾아 보여 줍니다 (위성 ↔ 지도 전환).
    // 네이버 지도 사진은 네이버 지도 API 키가 있어야 넣을 수 있어서, 키 없이 쓸 수 있는 구글 지도 화면을 임시로 사용합니다.
    if (t.address) {
      const q = encodeURIComponent(t.address);
      const src = (type) => `https://maps.google.com/maps?q=${q}&t=${type}&z=17&hl=ko&output=embed`;
      const box = el('div', 'mapbox');
      const frame = el('iframe');
      frame.title = t.name + ' 위치 지도';
      frame.loading = 'lazy';
      frame.referrerPolicy = 'no-referrer-when-downgrade';
      frame.src = src('k');
      const tabs = el('div', 'maptabs');
      [['k', '위성사진'], ['m', '지도']].forEach(([type, label], i) => {
        const b = el('button', 'btn small ' + (i ? 'ghost' : ''), label); b.type = 'button';
        b.setAttribute('aria-pressed', String(i === 0));
        b.addEventListener('click', () => {
          frame.src = src(type);
          tabs.querySelectorAll('button').forEach((x) => { x.classList.toggle('ghost', x !== b); x.setAttribute('aria-pressed', String(x === b)); });
        });
        tabs.append(b);
      });
      box.append(tabs, frame);
      card.append(box);
    }

    // 네이버 지도: 주소로 검색한 결과를 새 창에서 엽니다
    if (t.address) {
      const act = el('div', 'actions');
      const m = el('a', 'btn naver', '네이버 지도에서 보기');
      m.href = 'https://map.naver.com/p/search/' + encodeURIComponent(t.address); m.target = '_blank'; m.rel = 'noopener noreferrer';
      act.append(m);
      if (t.phone) { const c = el('a', 'btn ghost', '전화 걸기'); c.href = 'tel:' + t.phone.replace(/[^0-9+]/g, ''); act.append(c); }
      card.append(act);
    }
    root.append(card);
  }

  async function load() {
    root.replaceChildren(el('div', 'state', '불러오는 중…'));
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/temple_info?select=*&order=id.asc&limit=1`, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (!rows.length) { root.replaceChildren(el('div', 'state', '절 소개가 아직 등록되지 않았습니다.')); return; }
      render(rows[0]);
    } catch (e) {
      const box = el('div', 'state', '정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      const b = el('button', 'btn ghost', '다시 불러오기'); b.type = 'button'; b.addEventListener('click', load);
      box.append(document.createElement('br'), b);
      root.replaceChildren(box);
    }
  }
  load();
  addToTopButton(); // 아래로 내려가면 나타나는 "맨 위로" 화살표 버튼
</script>
</body>
</html>
