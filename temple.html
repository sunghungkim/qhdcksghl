<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>절 소개</title>
<style>
  :root {
    --bg: #faf6ef;
    --panel: #ffffff;
    --text: #2b2118;
    --muted: #7a6a5b;
    --line: #e6dccd;
    --accent: #c8862a;
    --naver: #03a94d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 32px 40px;
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 820px; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; }
  h2 { margin: 0; font-size: 26px; }
  .intro { margin: 0; line-height: 1.7; white-space: pre-line; }
  .photo { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; align-items: baseline; }
  dt { color: var(--muted); font-size: 14px; }
  dd { margin: 0; font-size: 17px; line-height: 1.5; }
  dd a { color: inherit; font-weight: 700; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    display: inline-block; font: inherit; font-weight: 700; text-decoration: none;
    border-radius: 10px; padding: 11px 18px; color: #fff; background: var(--accent);
  }
  .btn.naver { background: var(--naver); }
  .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 400; }
  .btn:hover { filter: brightness(.95); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .note { margin: 0; font-size: 13px; color: var(--muted); }
  .state { padding: 40px 0; text-align: center; color: var(--muted); }
  .state button { margin-top: 12px; font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  @media (max-width: 720px) { body { padding: 20px 16px 32px; } dl { grid-template-columns: 1fr; gap: 2px; } dd { margin-bottom: 10px; } }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="state">불러오는 중…</div></div>

<script>
  // 공개용(publishable) 키입니다. 브라우저에 두어도 안전하며, 접근 범위는 DB의 RLS 규칙이 정합니다.
  const SUPABASE_URL = 'https://iixmdxfxayyjhnmngpve.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Thzc1yu4lKqvOKClASKUew_7FdA7lqv';
  const root = document.getElementById('root');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent 만 사용
    return e;
  }

  function render(t) {
    root.replaceChildren();
    const card = el('section', 'card');
    card.append(el('h2', null, t.name));
    if (t.intro) card.append(el('p', 'intro', t.intro));
    if (t.image_url && /^https:\/\//i.test(t.image_url)) {
      const img = el('img', 'photo'); img.src = t.image_url; img.alt = t.name; card.append(img);
    }

    const dl = el('dl');
    if (t.address) { dl.append(el('dt', null, '주소'), el('dd', null, t.address)); }
    if (t.phone) {
      const dd = el('dd');
      const a = el('a', null, t.phone); a.href = 'tel:' + t.phone.replace(/[^0-9+]/g, '');
      dd.append(a); dl.append(el('dt', null, '문의 및 접수'), dd);
    }
    if (dl.children.length) card.append(dl);

    // 네이버 지도: 주소로 검색한 결과를 새 창에서 엽니다 (지도 퍼가기에는 별도의 네이버 지도 키가 필요합니다)
    if (t.address) {
      const q = encodeURIComponent(t.address);
      const act = el('div', 'actions');
      const m = el('a', 'btn naver', '네이버 지도에서 보기');
      m.href = 'https://map.naver.com/p/search/' + q; m.target = '_blank'; m.rel = 'noopener noreferrer';
      act.append(m);
      if (t.phone) { const c = el('a', 'btn ghost', '전화 걸기'); c.href = 'tel:' + t.phone.replace(/[^0-9+]/g, ''); act.append(c); }
      card.append(act);
    }
    root.append(card);
  }

  async function load() {
    root.replaceChildren(el('div', 'state', '불러오는 중…'));
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/temple_info?select=*&order=id.asc&limit=1`, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (!rows.length) { root.replaceChildren(el('div', 'state', '절 소개가 아직 등록되지 않았습니다.')); return; }
      render(rows[0]);
    } catch (e) {
      const box = el('div', 'state', '정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      const b = el('button', null, '다시 불러오기'); b.type = 'button'; b.addEventListener('click', load);
      box.append(document.createElement('br'), b);
      root.replaceChildren(box);
    }
  }
  load();
</script>
</body>
</html>
