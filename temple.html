<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>절 소개</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { padding: 36px 40px 56px; }
  .wrap { max-width: 860px; display: grid; gap: 20px; }
  h2.name { margin: 0; font-size: 2rem; color: var(--brand-dark); }
  .intro { margin: 0; line-height: 1.85; white-space: pre-line; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 12px 24px; align-items: baseline; }
  dt { color: var(--muted); font-size: .95rem; }
  dd { margin: 0; font-size: 1.15rem; line-height: 1.6; }
  dd a { font-weight: 700; }
  .mapbox { display: grid; gap: 10px; }
  .mapbox iframe { width: 100%; height: 240px; border: 1px solid var(--line); border-radius: 14px; background: var(--sand); }
  .maptabs { display: flex; gap: 8px; }
  .btn.naver { background: #0a7d3b; }
  .btn.naver:hover { background: #07622e; }
  @media (max-width: 760px) { body { padding: 24px 16px 40px; } dl { grid-template-columns: 1fr; gap: 2px; } dd { margin-bottom: 12px; } }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="state">불러오는 중…</div></div>

<script>
  // 공개용(publishable) 키입니다. 브라우저에 두어도 안전하며, 접근 범위는 DB의 RLS 규칙이 정합니다.
  const SUPABASE_URL = 'https://iixmdxfxayyjhnmngpve.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Thzc1yu4lKqvOKClASKUew_7FdA7lqv';
  const root = document.getElementById('root');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent 만 사용
    return e;
  }

  function render(t) {
    root.replaceChildren();

    // 사진: image_url 이 있으면 사진, 없으면 "사진대체" 자리 (나중에 temple_info.image_url 에 주소를 넣으면 바뀜)
    // 사진 주소는 https:// 주소이거나 이 사이트의 images/ 폴더 안 파일만 허용
    if (t.image_url && /^(https:\/\/|images\/[\w.\-]+$)/i.test(t.image_url)) {
      const img = el('img', 'photo'); img.src = t.image_url; img.alt = t.name; root.append(img);
    } else {
      const ph = el('div', 'photo-ph', '사진대체'); ph.setAttribute('role', 'img'); ph.setAttribute('aria-label', '사진이 들어갈 자리');
      root.append(ph);
    }

    const card = el('section', 'card');
    card.style.display = 'grid'; card.style.gap = '18px';
    card.append(el('h2', 'name', t.name));
    if (t.intro) card.append(el('p', 'intro', t.intro));

    const dl = el('dl');
    if (t.address) dl.append(el('dt', null, '주소'), el('dd', null, t.address));
    if (t.phone) {
      const dd = el('dd');
      const a = el('a', null, t.phone); a.href = 'tel:' + t.phone.replace(/[^0-9+]/g, '');
      dd.append(a); dl.append(el('dt', null, '문의 및 접수'), dd);
    }
    if (dl.children.length) card.append(dl);

    // 작은 위치 사진: 주소로 찾아 보여 줍니다 (위성 ↔ 지도 전환).
    // 네이버 지도 사진은 네이버 지도 API 키가 있어야 넣을 수 있어서, 키 없이 쓸 수 있는 구글 지도 화면을 임시로 사용합니다.
    if (t.address) {
      const q = encodeURIComponent(t.address);
      const src = (type) => `https://maps.google.com/maps?q=${q}&t=${type}&z=17&hl=ko&output=embed`;
      const box = el('div', 'mapbox');
      const frame = el('iframe');
      frame.title = t.name + ' 위치 지도';
      frame.loading = 'lazy';
      frame.referrerPolicy = 'no-referrer-when-downgrade';
      frame.src = src('k');
      const tabs = el('div', 'maptabs');
      [['k', '위성사진'], ['m', '지도']].forEach(([type, label], i) => {
        const b = el('button', 'btn small ' + (i ? 'ghost' : ''), label); b.type = 'button';
        b.setAttribute('aria-pressed', String(i === 0));
        b.addEventListener('click', () => {
          frame.src = src(type);
          tabs.querySelectorAll('button').forEach((x) => { x.classList.toggle('ghost', x !== b); x.setAttribute('aria-pressed', String(x === b)); });
        });
        tabs.append(b);
      });
      box.append(tabs, frame);
      card.append(box);
    }

    // 네이버 지도: 주소로 검색한 결과를 새 창에서 엽니다
    if (t.address) {
      const act = el('div', 'actions');
      const m = el('a', 'btn naver', '네이버 지도에서 보기');
      m.href = 'https://map.naver.com/p/search/' + encodeURIComponent(t.address); m.target = '_blank'; m.rel = 'noopener noreferrer';
      act.append(m);
      if (t.phone) { const c = el('a', 'btn ghost', '전화 걸기'); c.href = 'tel:' + t.phone.replace(/[^0-9+]/g, ''); act.append(c); }
      card.append(act);
    }
    root.append(card);
  }

  async function load() {
    root.replaceChildren(el('div', 'state', '불러오는 중…'));
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/temple_info?select=*&order=id.asc&limit=1`, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      if (!rows.length) { root.replaceChildren(el('div', 'state', '절 소개가 아직 등록되지 않았습니다.')); return; }
      render(rows[0]);
    } catch (e) {
      const box = el('div', 'state', '정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      const b = el('button', 'btn ghost', '다시 불러오기'); b.type = 'button'; b.addEventListener('click', load);
      box.append(document.createElement('br'), b);
      root.replaceChildren(box);
    }
  }
  load();
</script>
</body>
</html>
